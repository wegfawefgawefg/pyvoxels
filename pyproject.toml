[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvoxels"
version = "0.1.0"
description = "Voxel renderer experiment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.5.2",
    "PyGLM>=2.7.1",
]

[project.scripts]
main = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.uv]
package = true
